# ---------------------------------------------------------------------------
# Daily one-trade bot configuration. Edit this file to tune the bot.
# ---------------------------------------------------------------------------

# Universe the bot chooses its ONE trade from each day.
watchlist: [SPY, QQQ, IWM, DIA, XLK, XLF, XLE, XLV, XLY, XLI, XLP, XLU, XLC,
            GLD, TLT, AAPL, MSFT, NVDA, AMZN, GOOGL, META, TSLA, AVGO, JPM]
benchmark: SPY               # used for the market-regime filter and comparisons

# Execution
broker: paper                # paper (built-in simulator) | alpaca
allow_live: false            # must be true AND env ALPACA_LIVE=1 for real-money trading
starting_cash: 10000         # paper account only
hold_days: 1                 # sessions to hold each trade
exit_at: open                # open = sell at the NEXT open (holds overnight, not a day trade)
                             # close = sell at the same day's close (day trade; backtests poorly)
allow_short: false           # long-only by default

# Risk management
risk_per_trade: 0.02         # risk 2% of equity between entry and stop
max_position_pct: 1.0        # never put more than 100% of equity in one trade
stop_atr_mult: 2.0           # stop = entry - 2.0 x ATR(14)
target_atr_mult: 4.0         # take profit = entry + 4.0 x ATR(14)
min_score: 0.15              # skip the day (stay in cash) if best score is below this
regime_filter: true          # if benchmark < 200-day SMA, require 2x the min_score

# Costs used by the backtester and paper broker
commission: 0.0              # $ per trade side
slippage_bps: 2              # 0.02% per side

# Strategy ensemble. Weights are the starting/base weights; with
# adaptive_weights the bot shifts weight toward strategies whose signals
# have been predicting next-day returns best over the lookback window.
strategies:
# Defaults chosen on 2013-2019 data only, then checked on 2020-2026 (see README).
  trend: 1.0                 # SMA 50/200 trend following
  tsmom: 1.0                 # 12-1 month time-series momentum (vol-scaled)
  xsmom: 1.0                 # 6-month cross-sectional (relative strength) momentum
  mean_reversion: 0.5        # RSI(2) pullback inside an uptrend (Connors-style)
  breakout: 0.0              # 20-day Donchian breakout with volume confirmation
  macd: 0.0                  # MACD histogram momentum
adaptive_weights: false
adaptive_lookback: 120       # trading days used to score strategies
adaptive_blend: 0.5          # 0 = fixed weights only, 1 = fully performance-driven

history_start: "2012-01-01"  # data download start

# ---------------------------------------------------------------------------
# Profiles override the settings above for a different market.
# The futures profile follows prop-firm rules: one trade per session, entered at
# the 6 PM ET Globex open, flat before the afternoon cutoff (no overnight holds
# across the daily close). Contracts are sized as micros.
#
# WARNING: in testing (2013-2026), these daily signals showed NO edge on
# one-session futures holds (about 0% a year on equity indices). Use the futures
# profile for alerts and tracking only until a futures-specific strategy is
# validated. `python -m tradebot --profile futures backtest` shows the numbers.
# ---------------------------------------------------------------------------
profiles:
  futures:
    watchlist: [ES=F, NQ=F, YM=F, RTY=F]   # traded as MES, MNQ, MYM, M2K (see instruments.py)
    benchmark: ES=F
    exit_at: close
    hold_days: 1
    allow_short: true
    regime_filter: false
    starting_cash: 50000                  # = prop account size for backtests
    risk_per_trade: 0.01                  # 1% of account (~$500 on 50K) - keep well under your daily loss limit
    stop_atr_mult: 1.0                    # one micro S&P at 1x ATR risks roughly $300-500
    target_atr_mult: 2.0
    max_contracts: 10                     # micros; set to your plan's limit
    commission: 0.50                      # $ per micro contract per side (check your firm)
    slippage_bps: 1
    flatten_time: "16:35"                 # ET - before your firm's cutoff
    strategies: {trend: 1.0, tsmom: 1.0, xsmom: 1.0, mean_reversion: 0.5, breakout: 0.0, macd: 0.0}
    adaptive_weights: false

# ---------------------------------------------------------------------------
# Day trading (python -m tradebot research / daytrade). One trade per day,
# chosen from the strategy library by the weekly research run.
# ---------------------------------------------------------------------------
daytrade:
  universe: [SPY, QQQ, IWM, DIA, XLK, XLF, XLE, XLV, AAPL, MSFT, NVDA, AMZN, GOOGL, META, TSLA, AVGO, JPM, AMD, NFLX]
  research_years: 5
  risk_per_trade: 0.01        # lose at most ~1% of the account if the stop is hit
  max_position_pct: 1.0       # position never larger than the account (no margin)
  slippage_bps: 2
  end_time: "15:10"           # last 5-minute bar; flat by 15:15 ET (fits GitHub's 6-hour job limit)
  gate:                       # a strategy must pass ALL of these to trade a live (real-money) account
    min_trades: 150
    min_t_stat: 2.0           # ~95% confidence the average trade is really positive
    min_profit_factor: 1.1
  live_requires_qualified: true   # live account: no qualified strategy -> no trades. Paper: trades the leader.
